name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Find project folder
        id: proj
        run: |
          f=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          if [ -z "$f" ]; then
            echo "settings.gradle.kts not found. Files in repository:"
            find . -not -path "./.git/*" -type f | head -n 80
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "Project folder: $(dirname "$f")"

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: signal-detector-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: signal-detector-apk
          path: app/build/outputs/apk/debug/app-debug.apk
